<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Information</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .greeting-text {
            color: #718096;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .patient-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            font-weight: 700;
            margin: 0 auto 2rem;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .patient-name {
            color: #2d3748;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .patient-body {
            color: black;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, black 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .patient-label {
            color: #a0aec0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
            margin: 2rem 0;
        }

        .info-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f6f8fb 0%, #e9ecef 100%);
            color: #667eea;
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 1rem;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .card {
                padding: 2rem;
            }

            .patient-name {
                font-size: 2rem;
            }

            .patient-avatar {
                width: 100px;
                height: 100px;
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <!-- Avatar with first letter of name -->
    <div class="patient-avatar" th:text="${#strings.substring(name, 0, 1).toUpperCase()}">
        P
    </div>

    <!-- Greeting text -->
    <p class="greeting-text">Hello Patient:</p>

    <!-- Patient full name -->
    <h1 class="patient-name">
        <span th:text="${name}"></span>
        <span th:text="${lastName}"></span>
    </h1>

    <!-- patient info -->
    <h2 class="patient-body">
        <span th:text="${email}"></span>
        <span th:text="${admission}"></span>
    </h2>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Patient label badge -->
    <div class="patient-label">Registered Patient</div>

    <!-- Info badge -->
    <div class="info-badge">
        ✓ Active Profile
    </div>
</div>
</body>
</html>
